name: Build Check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - master
      - experimental
      - main
jobs:
  job_ubuntu_build_check:
    name: ubuntu Build and analyze
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y --fix-missing build-essential ninja-build ccache \
          libvorbis-dev zlib1g-dev libhunspell-dev \
          liblzo2-dev \
          libavutil-dev libavformat-dev \
          libzstd-dev libxkbcommon-dev \
          libxapian-dev libopencc-dev \
          qt6-base-dev \
          qt6-multimedia-dev \
          qt6-tools-dev \
          qt6-tools-dev-tools \
          libtomlplusplus-dev
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ubuntu
      - name: Run build
        run: |
          export CXXFLAGS="-Wall"
          mkdir build_dir
          cmake -S . \
            -B ./build_dir \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja
          cd ./build_dir
          ninja -k 0
  job_macos_build_check:
    name: macos Build and analyze
    permissions:
      contents: read
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install --force --overwrite \
          create-dmg \
          ccache \
          opencc \
          ffmpeg@6 \
          libao \
          libiconv \
          lzip \
          libvorbis \
          hunspell \
          xapian \
          tomlplusplus \
          qt || true
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-macos
      - name: Run build
        run: |
          mkdir build_dir
          export CXXFLAGS="-Wall"
          export PKG_CONFIG_PATH="`brew --prefix ffmpeg@6`/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . \
            -B ./build_dir \
            -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cd ./build_dir
          ninja -k 0
  job_archlinux_build_check:
    name: archlinux Build and analyze
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/archlinux/archlinux:base-devel
    steps:
      - name: Print Version
        run: |
          if [[ -f /etc/os-release ]]; then
            cat /etc/os-release
          fi
      - name: Install dependencies
        run: |
          pacman --noconfirm -Syuu \
          cmake \
          ffmpeg \
          hunspell \
          libvorbis \
          lzo \
          ninja \
          opencc \
          qt6-base \
          qt6-multimedia \
          qt6-tools \
          tomlplusplus \
          xapian-core

      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Run build
        run: |
          mkdir build_dir
          export CXXFLAGS="-Wall"
          cmake -S . \
            -B ./build_dir \
            -G Ninja \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cd "./build_dir"
          ninja -k 0
